[project]
name = "agentswe-general"
version = "0.1.0"
description = "General-purpose purple agent for AgentBeats Sprint 4"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "uvicorn>=0.38.0",
    "openai>=1.55.0",
    "httpx>=0.28.1",
    # OfficeQA retrieval (loaded lazily; only used when retrieval_enabled=true).
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]
